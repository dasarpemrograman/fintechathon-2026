[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fincathon"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "fastapi==0.143.2",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "pycountry==26.2.16",
    "pypdf==6.21.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "reportlab==5.0.1",
    "sqlalchemy==2.1.4",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
include = ["packages*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
