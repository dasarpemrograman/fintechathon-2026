      description: Proof creates pending status only. Verified bank evidence and authorized review are
        required. Duplicate references cannot settle twice; reversal appends history.
      allOf:
      - if:
          properties:
            status:
              const: pending
        then:
          properties:
            verified_by:
              type: 'null'
      - if:
          properties:
            status:
              const: verified
        then:
          properties:
            verified_by:
              $ref: '#/components/schemas/Id'
