      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        status:
          type: string
          enum:
          - unresolved
          - failed
          - satisfied
          - not_applicable
        reason:
          type: string
        required_action:
          anyOf:
          - type: string
          - type: 'null'
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
      required:
      - code
      - status
      - reason
      - required_action
      - evidence_refs
    Gate:
      type: object
      additionalProperties: false
      properties:
        gate_id:
          $ref: '#/components/schemas/Id'
        stage:
          $ref: '#/components/schemas/Stage'
        evaluated_revision:
          $ref: '#/components/schemas/Revision'
        status:
          type: string
          enum:
          - blocked
          - ready_for_next_action
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/GateCondition'
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
        evaluated_at:
          $ref: '#/components/schemas/Instant'
      required:
      - gate_id
      - stage
      - evaluated_revision
      - status
      - conditions
      - evidence_refs
      - evaluated_at
      description: Server-derived; unmet critical conditions block. Approval cannot override missing agreement,
        funds, conformity or required documents.
      allOf:
      - if:
          properties:
            status:
              const: ready_for_next_action
        then:
          properties:
            conditions:
              items:
                properties:
                  status:
                    enum:
                    - satisfied
                    - not_applicable
        else:
          properties:
            conditions:
              contains:
                properties:
                  status:
                    enum:
                    - unresolved
                    - failed
                required:
                - status
              minContains: 1
