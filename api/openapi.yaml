      x-public-auth: false
  /v2/diagnostics:
    get:
      operationId: getDiagnostics
      summary: Read organization queue and invalidation diagnostics
      tags:
      - Workspace
      parameters: []
      responses:
        '200':
          description: Typed application result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          description: Sanitized server or response-contract failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-required-roles:
      - owner
      - export_admin
      x-revision-scope: none
      x-public-auth: false
components:
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 200
    Revision:
      type: integer
      minimum: 1
    Decimal:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
      description: Finite base-10 decimal string; never a JSON number or exponent. Use decimal arithmetic
        with at least 28 significant digits.
    UnsignedDecimal:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
    Currency:
      type: string
      pattern: ^[A-Z]{3}$
      description: ISO 4217 code. Server validates current registry membership; never limited to fixture
        currencies.
    Country:
      type: string
      pattern: ^[A-Z]{2}$
      description: ISO 3166-1 alpha-2. Server validates registry membership and reports jurisdiction coverage
        separately.
    Instant:
      type: string
      format: date-time
      description: RFC 3339 instant with offset. Store instants in UTC.
    LocalDate:
      type: string
      format: date
    Timezone:
      type: string
      minLength: 1
      description: IANA timezone identifier, validated against the timezone database.
    Hash:
      type: string
      pattern: ^[a-f0-9]{64}$
    ValueStatus:
      type: string
      enum:
      - missing
      - unreviewed
      - confirmed
      - conflicted
      - expired
    DataMode:
      type: string
      enum:
      - live
      - cached
      - synthetic_demo
      - user_provided
    BusinessProfile:
      type: string
      enum:
      - producer
      - reseller
    Mode:
      type: string
      enum:
      - sandbox
      - deal
    ArtifactKind:
      type: string
      enum:
      - recommendation
      - message
      - agreement
      - clause_revision
      - amendment
      - finance_pack
    Stage:
      type: string
      enum:
      - analysis
      - plan_review
      - procurement_production
      - booking
      - shipment
      - internal_close
    Role:
      type: string
      enum:
      - owner
      - export_admin
      - finance_reviewer
      - production_procurement
    EvidenceCategory:
      type: string
      enum:
      - requirements
      - freight
      - market_price
      - fx
      - finance
      - product
    Money:
      type: object
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/UnsignedDecimal'
        currency:
          $ref: '#/components/schemas/Currency'
      required:
      - amount
      - currency
    SignedMoney:
      type: object
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/Currency'
      required:
      - amount
      - currency
    Ref:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        revision:
          $ref: '#/components/schemas/Revision'
      required:
      - id
    Meta:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tenant_id:
          $ref: '#/components/schemas/Id'
        created_at:
          $ref: '#/components/schemas/Instant'
        created_by:
          $ref: '#/components/schemas/Id'
      required:
      - id
      - tenant_id
      - created_at
      - created_by
    Issue:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        field_path:
          anyOf:
          - type: string
          - type: 'null'
        reason:
          type: string
        required_action:
          type: string
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
      required:
      - code
      - field_path
      - reason
      - required_action
      - evidence_refs
    Unknown:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - missing
          - conflicted
          - expired
          - unreviewed
        reason:
          type: string
          minLength: 1
        field_path:
          type: string
      required:
      - status
      - reason
      - field_path
    ProductAttribute:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        value:
          type: string
        unit:
          anyOf:
          - type: string
          - type: 'null'
        status:
          $ref: '#/components/schemas/ValueStatus'
        evidence_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        comparison:
          enum:
          - eq
          - lte
          - gte
          description: Explicit reviewed interpretation of value; no inequality is inferred from free
            text.
      required:
      - name
      - value
      - unit
      - status
      - evidence_ids
    HsCandidate:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        jurisdiction:
          $ref: '#/components/schemas/Country'
        edition:
          type: string
        status:
          $ref: '#/components/schemas/ValueStatus'
        evidence_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
      required:
      - code
      - jurisdiction
      - edition
      - status
      - evidence_ids
    Product:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
        form:
          anyOf:
          - type: string
          - type: 'null'
        intended_use:
          anyOf:
          - type: string
          - type: 'null'
        grade:
          anyOf:
          - type: string
          - type: 'null'
        processing:
          anyOf:
          - type: string
          - type: 'null'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'
        hs_candidates:
          type: array
          items:
            $ref: '#/components/schemas/HsCandidate'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/Unknown'
      required:
      - description
    LineItem:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          anyOf:
          - $ref: '#/components/schemas/UnsignedDecimal'
          - type: 'null'
        unit:
          type: string
        goods_origin_country:
          anyOf:
          - $ref: '#/components/schemas/Country'
          - type: 'null'
        evidence_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/Unknown'
      required:
      - id
      - product
      - quantity
      - unit
      - goods_origin_country
      - evidence_ids
      - unknowns
    Party:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        legal_name:
          anyOf:
          - type: string
          - type: 'null'
        display_name:
          type: string
        registration_identifier:
          anyOf:
          - type: string
          - type: 'null'
        country:
          anyOf:
          - $ref: '#/components/schemas/Country'
          - type: 'null'
        roles:
          type: array
          items:
            type: string
            enum:
            - seller
            - buyer
            - supplier
            - production_input
            - carrier
            - forwarder
            - broker
            - insurer
            - lender
            - laboratory
            - importer
        evidence_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/Unknown'
      required:
      - id
      - legal_name
      - display_name
      - registration_identifier
      - country
      - roles
      - evidence_ids
      - unknowns
    Package:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 1
        length_cm:
          $ref: '#/components/schemas/UnsignedDecimal'
        width_cm:
          $ref: '#/components/schemas/UnsignedDecimal'
        height_cm:
          $ref: '#/components/schemas/UnsignedDecimal'
      required:
      - count
      - length_cm
      - width_cm
      - height_cm
    ShipmentLine:
      type: object
      additionalProperties: false
      properties:
        line_item_id:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/UnsignedDecimal'
        unit:
          type: string
      required:
      - line_item_id
      - quantity
      - unit
    Shipment:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentLine'
        dispatch_country:
          $ref: '#/components/schemas/Country'
        destination_country:
          $ref: '#/components/schemas/Country'
        transit_countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'
        origin_address:
          anyOf:
          - type: string
          - type: 'null'
        destination_address:
          anyOf:
          - type: string
          - type: 'null'
        origin_port:
          anyOf:
          - type: string
          - type: 'null'
        destination_port:
          anyOf:
          - type: string
          - type: 'null'
        mode:
          type: string
          enum:
          - sea_lcl
          - sea_fcl
          - air
          - road
          - rail
          - multimodal
          - other
        mode_details:
          anyOf:
          - type: string
          - type: 'null'
        packages:
          type: array
          items:
            $ref: '#/components/schemas/Package'
        gross_kg:
          anyOf:
          - $ref: '#/components/schemas/UnsignedDecimal'
          - type: 'null'
        net_kg:
          anyOf:
          - $ref: '#/components/schemas/UnsignedDecimal'
          - type: 'null'
        incoterm:
          anyOf:
          - type: string
          - type: 'null'
        incoterm_version:
          anyOf:
          - type: string
          - type: 'null'
        named_place:
          anyOf:
          - type: string
          - type: 'null'
        risk_transfer_point:
          anyOf:
          - type: string
          - type: 'null'
        special_handling:
          type: array
          items:
            type: string
        milestone_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/Unknown'
      required:
      - id
      - lines
      - dispatch_country
      - destination_country
      - mode
      - unknowns
    Allocation:
      type: object
      additionalProperties: false
      properties:
        line_item_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        shipment_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        fraction:
          $ref: '#/components/schemas/UnsignedDecimal'
      required:
      - line_item_id
      - shipment_id
      - fraction
      description: At least one target required. Fraction is in [0,1]; allocations for a source amount
        sum to 1 without double counting. Enforced by server using decimal arithmetic.
    CashSnapshot:
      type: object
      additionalProperties: false
      properties:
        available:
          $ref: '#/components/schemas/Money'
        as_of:
          $ref: '#/components/schemas/Instant'
        committed_elsewhere:
          $ref: '#/components/schemas/Money'
        minimum_buffer:
          $ref: '#/components/schemas/Money'
      required:
      - available
      - as_of
      - committed_elsewhere
      - minimum_buffer
    OwnerConstraints:
      type: object
      additionalProperties: false
      properties:
        cash_snapshot:
          anyOf:
          - $ref: '#/components/schemas/CashSnapshot'
          - type: 'null'
        target_contribution_margin:
          anyOf:
          - $ref: '#/components/schemas/UnsignedDecimal'
          - type: 'null'
        delivery_deadline:
          anyOf:
          - $ref: '#/components/schemas/TemporalValue'
          - type: 'null'
        credit_tenor_limit_days:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        allowable_changes:
          type: array
          items:
            type: string
        ranking_preference:
          anyOf:
          - type: string
            enum:
            - cash
            - margin
            - payment_risk
            - balanced
          - type: 'null'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/Unknown'
      required:
      - cash_snapshot
      - target_contribution_margin
      - delivery_deadline
      - credit_tenor_limit_days
      - allowable_changes
      - ranking_preference
      - unknowns
    TemporalValue:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          date:
            $ref: '#/components/schemas/LocalDate'
          timezone:
            $ref: '#/components/schemas/Timezone'
        required:
        - date
        - timezone
      - type: object
        additionalProperties: false
        required:
        - instant
        - timezone
        properties:
          instant:
            $ref: '#/components/schemas/Instant'
          timezone:
            $ref: '#/components/schemas/Timezone'
      description: Local date or instant; never turn a date-only deadline into an assumed UTC midnight.
    FixedSchedule:
      type: object
      additionalProperties: false
      properties:
        kind:
          const: fixed
        due:
          $ref: '#/components/schemas/TemporalValue'
      required:
      - kind
      - due
    RelativeSchedule:
      type: object
      additionalProperties: false
      properties:
        kind:
          const: event_relative
        anchor_milestone_id:
          $ref: '#/components/schemas/Id'
        offset_days:
          type: integer
        day_basis:
          type: string
          enum:
          - calendar
          - business
        business_calendar_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - kind
      - anchor_milestone_id
      - offset_days
      - day_basis
      - business_calendar_id
      description: Business-day offsets require a named calendar with holiday policy. Dependencies must
        be acyclic. Forecast updates do not amend agreed formulas.
      allOf:
      - if:
          properties:
            day_basis:
              const: business
        then:
          properties:
            business_calendar_id:
              $ref: '#/components/schemas/Id'
    Schedule:
      oneOf:
      - $ref: '#/components/schemas/FixedSchedule'
      - $ref: '#/components/schemas/RelativeSchedule'
      discriminator:
        propertyName: kind
        mapping:
          fixed: '#/components/schemas/FixedSchedule'
          event_relative: '#/components/schemas/RelativeSchedule'
    PaymentTerm:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        side:
          type: string
          enum:
          - buyer
          - supplier
          - production_input
        payer_id:
          $ref: '#/components/schemas/Id'
        payee_id:
          $ref: '#/components/schemas/Id'
        invoice_id:
          $ref: '#/components/schemas/Id'
        amount:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        invoice_fraction:
          anyOf:
          - $ref: '#/components/schemas/UnsignedDecimal'
          - type: 'null'
        schedule:
          $ref: '#/components/schemas/Schedule'
        instrument:
          type: string
          enum:
          - advance
          - milestone
          - open_account
          - lc
          - collection
          - other
        instrument_details:
          anyOf:
          - type: string
          - type: 'null'
        status:
          type: string
          enum:
          - proposed
          - agreed
          - superseded
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'
        evidence_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/Unknown'
        sequence:
          type: integer
          minimum: 0
          description: Declared same-instant ordering; absence requires a debit-first stress case.
      required:
      - id
      - side
      - payer_id
      - payee_id
      - invoice_id
      - amount
      - invoice_fraction
      - schedule
      - instrument
      - instrument_details
      - status
      - allocations
      - evidence_ids
      - unknowns
      description: Amount or invoice fraction is required for calculation; missing terms produce partial
        analysis. Unsupported instrument schedules require review, never a substituted formula.
    PurchaseLine:
      type: object
      additionalProperties: false
      properties:
        line_item_id:
          $ref: '#/components/schemas/Id'
        supplier_party_id:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/UnsignedDecimal'
        unit:
          type: string
        unit_cost:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        payment_term_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        evidence_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        paid_before_snapshot:
          type: boolean
          description: Explicit historical payment evidence; economic cost still applies.
      required:
      - line_item_id
      - supplier_party_id
      - quantity
      - unit
      - unit_cost
      - payment_term_ids
      - evidence_ids
    ProductionInput:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        description:
          type: string
        quantity:
          anyOf:
          - $ref: '#/components/schemas/UnsignedDecimal'
          - type: 'null'
        unit:
          type: string
        unit_cost:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        supplier_party_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        payment_term_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        evidence_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        paid_before_snapshot:
          type: boolean
          description: Explicit historical payment evidence; economic cost still applies.
      required:
      - id
      - description
      - quantity
      - unit
      - unit_cost
      - supplier_party_id
      - payment_term_ids
      - evidence_ids
    ProductionCost:
      type: object
      additionalProperties: false
      properties:
        category:
          type: string
          enum:
          - labor
          - overhead
          - process
          - outsourcing
          - other
        description:
          type: string
        amount:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        milestone_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        evidence_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        paid_before_snapshot:
          type: boolean
          description: Explicit historical payment evidence; economic cost still applies.
        payment_term_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
      required:
      - category
      - description
      - amount
      - milestone_id
      - evidence_ids
    ResellerProcurement:
      type: object
      additionalProperties: false
      properties:
        business_profile:
          const: reseller
        purchase_lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseLine'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/Unknown'
      required:
      - business_profile
      - purchase_lines
      - unknowns
    ProducerProcurement:
      type: object
      additionalProperties: false
      properties:
        business_profile:
          const: producer
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/ProductionInput'
        costs:
          type: array
          items:
            $ref: '#/components/schemas/ProductionCost'
        usable_yield:
          anyOf:
          - $ref: '#/components/schemas/UnsignedDecimal'
          - type: 'null'
        batch_quantity:
          anyOf:
          - $ref: '#/components/schemas/UnsignedDecimal'
          - type: 'null'
        unit:
          type: string
        capacity_quantity:
          anyOf:
          - $ref: '#/components/schemas/UnsignedDecimal'
          - type: 'null'
        capacity_period:
          anyOf:
          - type: string
          - type: 'null'
        milestone_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/Unknown'
      required:
      - business_profile
      - inputs
      - costs
      - usable_yield
      - batch_quantity
      - unit
      - capacity_quantity
      - capacity_period
      - milestone_ids
      - unknowns
    ProcurementPlan:
      oneOf:
      - $ref: '#/components/schemas/ResellerProcurement'
      - $ref: '#/components/schemas/ProducerProcurement'
      discriminator:
        propertyName: business_profile
        mapping:
          reseller: '#/components/schemas/ResellerProcurement'
          producer: '#/components/schemas/ProducerProcurement'
    Workspace:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tenant_id:
          $ref: '#/components/schemas/Id'
        created_at:
          $ref: '#/components/schemas/Instant'
        created_by:
          $ref: '#/components/schemas/Id'
        schema_version:
          const: '2.2'
        revision:
          $ref: '#/components/schemas/Revision'
        mode:
          $ref: '#/components/schemas/Mode'
        business_profile:
          $ref: '#/components/schemas/BusinessProfile'
        seller_domicile:
          anyOf:
          - $ref: '#/components/schemas/Country'
          - type: 'null'
        dispatch_country:
          anyOf:
          - $ref: '#/components/schemas/Country'
          - type: 'null'
        destination_country:
          anyOf:
          - $ref: '#/components/schemas/Country'
          - type: 'null'
        reporting_currency:
          $ref: '#/components/schemas/Currency'
        owner_timezone:
          $ref: '#/components/schemas/Timezone'
        product:
          $ref: '#/components/schemas/Product'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/Unknown'
        deal_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        execution_scope:
          type: string
          enum:
          - demo
          - real
        dataset_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        archived:
          type: boolean
        planning_inputs:
          anyOf:
          - $ref: '#/components/schemas/PlanningInputs'
          - type: 'null'
        snapshot_hash:
          $ref: '#/components/schemas/Hash'
      required:
      - id
      - tenant_id
      - created_at
      - created_by
      - schema_version
      - revision
      - mode
      - business_profile
      - seller_domicile
      - dispatch_country
      - destination_country
      - reporting_currency
      - owner_timezone
      - product
      - unknowns
      - deal_id
