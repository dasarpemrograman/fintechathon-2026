            examples:
              generalProducer:
                value:
                  mode: sandbox
                  business_profile: producer
                  seller_domicile: KE
                  dispatch_country: KE
                  destination_country: DE
                  reporting_currency: EUR
                  owner_timezone: Africa/Nairobi
                  product:
                    description: Dried fruit
                    form: dried
                    intended_use: food
                    attributes:
                    - name: species
                      value: mango
                      unit: null
                      status: unreviewed
                      evidence_ids: []
                    unknowns:
                    - field_path: /product/hs_candidates
                      status: missing
                      reason: Classification requires review
