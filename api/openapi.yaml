  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Deployment-provided bearer authentication. Tenant and roles derive from authenticated
        membership, never a client tenant_id. Token issuance/provider selection is deferred.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Scoped by tenant, actor and operation. Same key + same canonical request replays original
        status/body; changed request returns 409. Record atomically with revision update/outbox. A replay
        is checked before rejecting a now-stale revision.
  headers:
    RequestId:
      description: Correlation ID also present in the response body.
      schema:
        $ref: '#/components/schemas/Id'
    RetryAfter:
      description: Seconds before retry, when applicable.
      schema:
        type: integer
        minimum: 0
  responses:
    Error400:
      description: Malformed request
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: Authentication required
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Insufficient role or entitlement; existing records and manual obligations remain accessible
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Resource absent or outside authenticated tenant; do not disclose cross-tenant existence
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: Stale revision, idempotency mismatch or external event conflict
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error413:
      description: Upload exceeds configured limits
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error415:
      description: Unsupported content/media type
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error422:
      description: Invalid domain input, reference, currency, timezone, date dependency or allocation
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error429:
      description: Quota or rate limit; no automatic overage
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error503:
      description: Required dependency unavailable; retain committed partial work
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  examples:
    MalformedRequest:
      summary: Synthetic malformed-input error.
      value:
        request_id: request_example
        code: MALFORMED_REQUEST
        message: Unable to parse request body.
        issues:
        - code: INVALID_JSON
          field_path: null
          reason: Request body is not valid JSON.
          required_action: Submit a valid JSON object.
          evidence_refs: []
        current_revision: null
        retry_after_seconds: null
