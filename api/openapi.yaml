openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ALLExport Export Deal Workspace API
  version: 2.2.0
  summary: Canonical contract for the export workspace runtime and scoped synthetic demo.
  description: 'The sole normative API and wire-schema source for this repository. Runtime request/response
    enforcement uses this document; deployment and live readiness must be verified separately. General/Business
    context dated 2026-10-16 supersedes historical country, commodity and single-shipment restrictions
    in the V2 system spec. Schema version 2.2 includes explicit execution scope, invoice inputs and operational
    APIs. Snapshot 2.1 migration preserves originals; compatibility is explicit, never silent.


    All resources and references are tenant-scoped. Membership and roles come from verified authentication,
    never request fields. x-required-roles lists any acceptable organization role; reads still require
    object-level authorization. External counterparties are parties, not authenticated reviewers by implication.


    Every mutation requires Idempotency-Key; existing-resource mutations also require expected_revision.
    Revision scope is workspace before conversion and deal after conversion. Transactions atomically compare
    revision, append immutable records, invalidate dependent hashes, and persist outbox work. Queued jobs
    bind the accepted input revision and never overwrite a newer revision; stale outputs are retained
    as superseded. 202 means accepted only. Business conditions return status=blocked with structured
    blockers; malformed or invalid requests use HTTP errors. Async partial output is explicit, never synthetic
    success.


    Canonical digest: SHA-256 over UTF-8 JSON with sorted keys, compact separators, original array order,
    NFC-normalized business strings, decimal strings and ISO dates. Retain raw evidence bytes separately.
    Bind input snapshot, selected evidence versions, rule versions and calculator version. Hashes are
    not authority. Precision is at least 28 significant digits; output rounding is explicit per calculation/instrument,
    never binary float.


    Missing values use null with a corresponding unknown/status reason. Registry membership, arithmetic,
    cross-reference ownership, acyclic schedules, profile consistency, current approval hashes and all
    business predicates must be validated by the eventual server beyond JSON Schema. Known-items-only
    calculations cannot claim complete funding requirements.


    Execution gates are derived. Owner approval is separate from counterparty agreement, payment verification
    and physical goods evidence. Critical missing conditions block subsequent actions. Buyer paid remains
    independent of internal reconciliation. Financing stops at application preparation; generated drafts
    are not sent. Calendar is an optional approved one-way projection with no attendees.


    Read access, existing artifacts and manual obligations/receipt updates survive entitlement expiry
    subject to retention policy. Quotas gate only new chargeable provider work. Internal retries are deduplicated,
    no automatic overage. This contract defines no checkout, lender submission, payment execution, customs
    filing or trade-message sending endpoint.'
servers:
- url: /
  description: Relative to the deployed application origin; no deployment implied.
